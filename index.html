<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>App Utensílios</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container {
  background:white;
  padding:25px;
  border-radius:12px;
  width:300px;
  text-align:center;
}
input, button {
  width:100%;
  padding:10px;
  margin:8px 0;
}
</style>

</head>
<body>

<div class="container">
<h2>Utensílios</h2>

<input type="text" id="texto" placeholder="Digite um item">
<button onclick="salvar()">Salvar</button>

<ul id="lista"></ul>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgAv-3QaBdPiMoCzY06CO_ayA2NSurLhU",
  authDomain: "ibc-utensilios.firebaseapp.com",
  databaseURL: "https://ibc-utensilios-default-rtdb.firebaseio.com",
  projectId: "ibc-utensilios",
  storageBucket: "ibc-utensilios.firebasestorage.app",
  messagingSenderId: "992341147645",
  appId: "1:992341147645:web:ade43eb54c2d8cff202394"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 🔥 caminho simples (sem login)
const caminho = ref(db, 'itens');

// SALVAR
window.salvar = function() {
  const input = document.getElementById("texto");
  const texto = input.value;

  if (!texto) return;

  push(caminho, texto); // salva corretamente
  input.value = "";
};

// LER E MOSTRAR
onValue(caminho, (snapshot) => {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if (!snapshot.exists()) {
    lista.innerHTML = "<li>Nenhum item ainda</li>";
    return;
  }

  snapshot.forEach(child => {
    const li = document.createElement("li");
    li.textContent = child.val();
    lista.appendChild(li);
  });
});
</script>

</body>
</html>
