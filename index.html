<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>App Utensílios Firebase</title>
<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container {
  background:white;
  padding:25px;
  border-radius:12px;
  width:300px;
  text-align:center;
}
input, button {
  width:100%;
  padding:10px;
  margin:8px 0;
}
#app { display:none; }
</style>
</head>
<body>

<div class="container" id="loginBox">
<h2>Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="senha" placeholder="Senha">
<button onclick="registrar()">Criar Conta</button>
<button onclick="login()">Entrar</button>
</div>

<div class="container" id="app">
<h2>Utensílios</h2>
<input type="text" id="texto" placeholder="Digite um item">
<button onclick="salvar()">Salvar</button>
<button onclick="logout()">Sair</button>
<ul id="lista"></ul>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgAv-3QaBdPiMoCzY06CO_ayA2NSurLhU",
  authDomain: "ibc-utensilios.firebaseapp.com",
  databaseURL: "https://ibc-utensilios-default-rtdb.firebaseio.com",
  projectId: "ibc-utensilios",
  storageBucket: "ibc-utensilios.firebasestorage.app",
  messagingSenderId: "992341147645",
  appId: "1:992341147645:web:ade43eb54c2d8cff202394"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let userId = null;

window.registrar = () => {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;
  createUserWithEmailAndPassword(auth, email, senha)
    .catch(e => alert(e.message));
};

window.login = () => {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;
  signInWithEmailAndPassword(auth, email, senha)
    .catch(e => alert(e.message));
};

window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    userId = user.uid;
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").style.display = "block";

    const dadosLocal = JSON.parse(localStorage.getItem("dados")) || [];
    render(dadosLocal);

    sincronizar();
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
});

function salvar() {
  const input = document.getElementById("texto");
  const texto = input.value;

  if (!userId || !texto) return;

  let dados = JSON.parse(localStorage.getItem("dados")) || [];
  dados.push(texto);

  localStorage.setItem("dados", JSON.stringify(dados));
  set(ref(db, 'usuarios/' + userId), dados);

  input.value = "";
}

function sincronizar() {
  const caminho = ref(db, 'usuarios/' + userId);

  onValue(caminho, (snapshot) => {
    if (snapshot.exists()) {
      const dados = snapshot.val();
      localStorage.setItem("dados", JSON.stringify(dados));
      render(dados);
    } else {
      const dadosLocal = JSON.parse(localStorage.getItem("dados")) || [];
      render(dadosLocal);
    }
  });
}

function render(dados) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  dados.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item;
    lista.appendChild(li);
  });
}
</script>

</body>
</html>
